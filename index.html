<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mirrativ TOOL BOX</title>
<style>
:root{--bg:#0b1020;--card:#151d31;--ink:#eef3ff;--muted:#a7b2ca;--line:#2b3652;--soft:#202b45;--accent:#55c7ee;--accent2:#a5e7ff;--shadow:0 14px 38px #0005}
[data-theme=blue]{--bg:#0b1020;--card:#151d31;--ink:#eef3ff;--muted:#a7b2ca;--line:#2b3652;--soft:#202b45;--accent:#55c7ee;--accent2:#a5e7ff}
[data-theme=purple]{--bg:#130f23;--card:#211a38;--ink:#f4efff;--muted:#b9add4;--line:#41345f;--soft:#30264c;--accent:#b99aff;--accent2:#e0d1ff}
[data-theme=pink]{--bg:#21111d;--card:#321c2c;--ink:#fff0f7;--muted:#d1aebe;--line:#59364d;--soft:#47283c;--accent:#f28cbd;--accent2:#ffd0e5}
[data-theme=dark]{--bg:#080b12;--card:#141923;--ink:#f1f4fa;--muted:#a0a9b9;--line:#303847;--soft:#222a38;--accent:#9eacc4;--accent2:#e1e8f5}
[data-theme=green]{--bg:#0c1918;--card:#162a27;--ink:#eafff8;--muted:#a7c9bd;--line:#31534a;--soft:#203d35;--accent:#7ed6b5;--accent2:#c4ffe7}
[data-theme=cream]{--bg:#211d17;--card:#332c22;--ink:#fff8e9;--muted:#d0c1a5;--line:#5b4d39;--soft:#493d2c;--accent:#d8bd87;--accent2:#f5e4bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--accent) 19%,transparent),transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--soft);color:var(--ink);font-weight:700}button.primary{background:var(--accent);color:#101827;border-color:transparent}button:active{transform:translateY(1px)}
.wrap{max-width:1000px;margin:auto;padding:14px 14px 50px}.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;padding:8px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.menuBtn{font-size:20px;padding:8px 13px}.brandmini{font-weight:800;letter-spacing:.08em;font-size:13px;color:var(--accent2)}.spacer{flex:1}
.drawer{display:none;position:fixed;inset:0;z-index:20;background:#0009}.drawer.open{display:block}.drawerbox{width:min(310px,86vw);height:100%;background:var(--card);padding:18px;overflow:auto;box-shadow:var(--shadow)}.drawerhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.navbtn{display:flex;width:100%;text-align:left;margin:5px 0;align-items:center;gap:10px}.navbtn.active{background:var(--accent);color:#101827}
main{padding-top:8px}.hero{text-align:center;padding:26px 15px 22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 13%,var(--card)),var(--card));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:50%;width:230px;height:230px;top:-160px;left:-80px}.hero:after{left:auto;right:-120px;top:auto;bottom:-190px;width:300px;height:300px}
.avatar{width:108px;height:108px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 25px color-mix(in srgb,var(--accent) 40%,transparent);position:relative;z-index:1}.creator{font-weight:800;font-size:20px;margin:8px 0 2px;position:relative;z-index:1}.muted{color:var(--muted);font-size:12px;line-height:1.65}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent2);font-weight:800}.hero h1{font-size:clamp(25px,6vw,38px);letter-spacing:.08em;margin:8px 0}.hero p{margin:0 0 12px;color:var(--muted);font-size:12px}
.section{margin:18px 0}.section h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 5px 18px #0002}.tile{text-align:left;min-height:92px}.tile strong{display:block;margin:5px 0}.tile small{color:var(--muted);font-size:11px}.tile .ico{font-size:21px;color:var(--accent)}
.panel{margin:12px 0}.panel h2{font-size:18px;margin:0 0 5px}.intro{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.field{margin:10px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px}textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result{background:var(--soft);padding:13px;border-radius:12px;margin-top:12px}.big{font-size:25px;font-weight:800;color:var(--accent2);margin:3px 0}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px}.stat small{font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--accent2);font-size:17px;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.list{display:grid;gap:8px;margin-top:10px}.item{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px}.item p{font-size:12px;color:var(--muted);margin:5px 0}.bar{height:8px;background:var(--line);border-radius:20px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:var(--accent)}.hidden{display:none!important}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.copyrow{display:flex;gap:8px;align-items:center}.copyrow button{white-space:nowrap}.footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;margin:25px 0}.link{color:var(--accent2);text-decoration:none}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.keypad button{font-size:18px;padding:15px 4px}.display{font-size:28px;text-align:right;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:auto}
.monthhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.day{min-height:55px;padding:5px 3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:11px}.day b{display:block}.day em{display:block;font-style:normal;color:var(--accent2);font-size:9px;overflow:hidden;white-space:nowrap}.day.blank{border:0;background:transparent}
.soundgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sound{padding:14px;text-align:center}.sound span{display:block;font-size:22px;margin-bottom:5px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.soundgrid{grid-template-columns:repeat(3,1fr)}.wrap{padding-left:22px;padding-right:22px}}
@media(max-width:380px){.row{grid-template-columns:1fr}.hero{padding:20px 10px}.avatar{width:90px;height:90px}}

function goalsPage(){return card('目標管理・達成シミュレーター','目標ごとに進捗と達成見込みを管理します。',`<label>目標名</label><input id="gn" placeholder="例：今月のスターズ目標"><div class="row"><div><label>現在値</label><input id="gc" type="number" value="0"></div><div><label>目標値</label><input id="gt" type="number" value="1000"></div></div><div class="row"><div><label>1日あたりの増加見込み</label><input id="grate" type="number" value="100"></div><div><label>期限（任意）</label><input id="gdeadline" type="date"></div></div><button class="primary" onclick="addGoal()">目標を追加</button><div class="list">${goals.map((g,i)=>{let pct=g.target?Math.min(100,g.current/g.target*100):0,days=g.rate>0?Math.ceil(Math.max(0,g.target-g.current)/g.rate):null;return `<div class="item"><b>${esc(g.name)}</b><p>${fmt(g.current)} / ${fmt(g.target)}（${fmt(pct)}%）</p><div class="bar"><span style="width:${pct}%"></span></div><p>現在のペースで約 ${days===null?'計算不可':days+'日'} ／ 期限：${esc(g.deadline||'未設定')}</p><div class="actions"><button onclick="updateGoal(${i})">現在値を更新</button><button onclick="goals.splice(${i},1);save('goals',goals);show('goals')">削除</button></div></div>`}).join('')||'<p class="muted">目標はまだありません。</p>'}</div>`)}

function calendarPage(){let d=new Date(calYear,calMonth,1),start=d.getDay(),days=new Date(calYear,calMonth+1,0).getDate(),items=[...plans.map(x=>({...x,type:'配信'})),...events.map(x=>({...x,type:x.type||'記念日'}))];return card('カレンダー','配信予定・誕生日・記念日・イベントをまとめて管理します。',`<div class="field"><label>予定の種類</label><select id="ptype"><option>配信</option><option>誕生日</option><option>記念日</option><option>イベント</option></select></div><div class="row"><div><label>名前・予定名</label><input id="pname" placeholder="予定の名前"></div><div><label>日付と時刻</label><input id="pdate" type="datetime-local"></div></div><label>メモ</label><input id="pmemo" placeholder="任意"><button class="primary" onclick="addCalendarItem()">カレンダーに追加</button><div class="monthhead" style="margin-top:16px"><button onclick="changeMonth(-1)">‹</button><b>${calYear}年${calMonth+1}月</b><button onclick="changeMonth(1)">›</button></div><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${Array.from({length:start},()=>'<div class="day blank"></div>').join('')}${Array.from({length:days},(_,i)=>{let date=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,found=items.filter(x=>(x.date||'').slice(0,10)===date);return `<div class="day"><b>${i+1}</b>${found.map(x=>`<em>${esc(x.type)}:${esc(x.name)}</em>`).join('')}</div>`}).join('')}</div><h3>登録済み予定</h3><div class="list">${items.map((x)=>`<div class="item"><b>${esc(x.type)}：${esc(x.name)}</b><p>${esc(x.date)} ${esc(x.memo||'')}</p><button onclick="deleteCalendarItem('${x.type}', '${encodeURIComponent(x.name)}','${x.date}')">削除</button></div>`).join('')||'<p class="muted">予定はありません。</p>'}</div>`)}
let now=new Date(),calYear=now.getFullYear(),calMonth=now.getMonth();function changeMonth(v){calMonth+=v;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}show('calendar')}

function templatesPage(){let cats=['すべて',...new Set(templates.map(x=>x.cat))];return card('定型文ライブラリ','配信者・モデレーター向けの定期文を保存し、ワンタップでコピーできます。',`<label>カテゴリーで絞り込み</label><select id="tfilter" onchange="filterTemplates()">${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="templateList" class="list">${templateItems('すべて')}</div><h3>定型文を追加</h3><label>カテゴリー</label><input id="tcat" placeholder="例：モデレーター向け"><label>タイトル</label><input id="ttitle" placeholder="例：初見さん歓迎"><label>本文</label><textarea id="tbody" placeholder="定型文を入力"></textarea><button class="primary" onclick="addTemplate()">定型文を追加</button><p class="muted">本文中の「〇〇」は、コピー時に名前・絵文字・配信時間などへ置き換えられます。登録文はこのブラウザ内に保存されます。</p>`)}

function resolved(t){let name=$('vname').value,emoji=$('vemoji').value,time=$('vtime').value,other=$('vother').value;return t.body.replace(/〇〇/g,other||name).replace(/@@名前@@/g,name).replace(/@@絵文字@@/g,emoji).replace(/@@時間@@/g,time).replace(/@@その他@@/g,other).replace(/名前の後ろの絵文字/g,emoji)}

function playTone(type){let C=window.AudioContext||window.webkitAudioContext;if(!C){alert('このブラウザでは音声再生に対応していません');return}let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);let now=c.currentTime,seq=type==='fanfare'?[523,659,784,1046]:type==='drum'?[110,90,70]:type==='clap'?[900,500]:type==='wrong'?[220,160]:type==='correct'?[660,880]:[880];seq.forEach((f,i)=>{let osc=c.createOscillator(),gain=c.createGain();osc.type=type==='clap'?'square':'sine';osc.frequency.value=f;osc.connect(gain);gain.connect(c.destination);let t=now+i*.13;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.13,t+.01);gain.gain.exponentialRampToValueAtTime(.0001,t+.12);osc.start(t);osc.stop(t+.14)});setTimeout(()=>c.close(),1000)}
function addSound(){let f=$('sfile').files[0];if(!f){alert('音声ファイルを選択してください');return}if(f.size>2*1024*1024){alert('試作版では2MB以下の音声ファイルを推奨します。');return}let r=new FileReader();r.onload=()=>{personalSounds.push({name:$('sname').value||f.name,data:r.result});save('sounds',personalSounds);show('sounds')};r.readAsDataURL(f)}

let calcExpr='0';function calculatorPage(){return card('電卓','基本的な四則演算とパーセント計算に対応します。',`<div class="display" id="calcDisplay">0</div><div class="keypad">${['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','＋','0','.','=',''].map(k=>k?`<button onclick="calcKey('${k}')">${k}</button>`:'<span></span>').join('')}</div>`)}
function calcRender(){if($('calcDisplay'))$('calcDisplay').textContent=calcExpr}
function calcKey(k){if(k==='AC')calcExpr='0';else if(k==='⌫')calcExpr=calcExpr.length>1?calcExpr.slice(0,-1):'0';else if(k==='='){try{let e=calcExpr.replaceAll('×','*').replaceAll('÷','/').replaceAll('＋','+').replaceAll('−','-').replace(/%/g,'/100');if(!/^[0-9+*/.() -]+$/.test(e))throw 0;calcExpr=String(Function('"use strict";return ('+e+')')())}catch{calcExpr='エラー'}}else calcExpr=calcExpr==='0'?k:calcExpr+k;calcRender()}
function settingsPage(){return card('設定','テーマ・ホーム表示・データ管理を行います。',`<label>テーマカラー</label><select id="themeSelect" onchange="setTheme(this.value)">${[['blue','Blue・水色'],['purple','Purple・ラベンダー'],['pink','Pink'],['dark','Dark・ネイビー'],['green','Green・ミント'],['cream','Cream・ベージュ']].map(x=>`<option value="${x[0]}" ${theme===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><h3>データのバックアップ</h3><button class="primary" onclick="exportData()">バックアップを書き出す</button><label style="margin-top:12px">バックアップを復元</label><input id="backupFile" type="file" accept="application/json"><button onclick="importData()">読み込む</button><h3>ホーム画面</h3><p class="muted">現在の試作版では主要機能へのショートカットを固定表示しています。カードの並べ替え・表示切替は次の改善候補です。</p><h3>プライバシー・免責事項</h3><p class="muted">アカウント登録は不要です。入力内容は原則この端末・ブラウザ内に保存されます。ブラウザデータの消去や端末変更で失われる場合があります。定期的にバックアップしてください。本サイトはMirrativ公式とは関係のない非公式ツールです。</p><p><a class="link" href="https://x.com/ta_fu_ta_fu" target="_blank" rel="noopener">改善案・不具合報告：@ta_fu_ta_fu ↗</a></p>`)}
function setTheme(t){theme=t;document.body.dataset.theme=t;localStorage.setItem('mtb_theme',t)}
function exportData(){let keys=['history','goals','notes','events','plans','income','templates','sounds','theme'];let obj={};keys.forEach(k=>obj[k]=localStorage.getItem('mtb_'+k));let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mirrativ-tool-box-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){let f=$('backupFile').files[0];if(!f){alert('バックアップファイルを選んでください');return}let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);Object.entries(o).forEach(([k,v])=>{if(v!==null)localStorage.setItem('mtb_'+k,v)});alert('復元しました。画面を再読み込みします。');location.reload()}catch{alert('バックアップファイルを読み込めませんでした')}};r.readAsText(f)}
function copyText(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('コピーしました')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}
function fallbackCopy(t){let x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();try{document.execCommand('copy');alert('コピーしました')}catch{alert('コピーできませんでした。文章を選択してコピーしてください。')}x.remove()}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
show('home');
</script></body></html>
