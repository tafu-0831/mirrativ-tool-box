<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="Mirrativユーザー向けの無料配信サポートツール">
<title>Mirrativ TOOL BOX</title>
<style>
:root{--bg:#0b1020;--card:#151d31;--ink:#eef3ff;--muted:#a7b2ca;--line:#2b3652;--soft:#202b45;--accent:#55c7ee;--accent2:#a5e7ff;--shadow:0 14px 38px #0005}
[data-theme=blue]{--bg:#f1f8ff;--card:#ffffff;--ink:#23334d;--muted:#71829b;--line:#d6e5f5;--soft:#e5f2ff;--accent:#78bdf4;--accent2:#397ebd}
[data-theme=purple]{--bg:#f7f2ff;--card:#ffffff;--ink:#342b4a;--muted:#88799f;--line:#e5d9f5;--soft:#efe5ff;--accent:#b69ae8;--accent2:#8061b9}
[data-theme=pink]{--bg:#fff3f8;--card:#ffffff;--ink:#4b3040;--muted:#987b8b;--line:#f2dce7;--soft:#ffe7f1;--accent:#f39bc4;--accent2:#bd5f91}
[data-theme=dark]{--bg:#080b12;--card:#141923;--ink:#f1f4fa;--muted:#a0a9b9;--line:#303847;--soft:#222a38;--accent:#9eacc4;--accent2:#e1e8f5}
[data-theme=green]{--bg:#effaf5;--card:#ffffff;--ink:#244239;--muted:#718e83;--line:#d5eee3;--soft:#e0f5eb;--accent:#83d2b0;--accent2:#398e6d}
[data-theme=cream]{--bg:#fff9ed;--card:#ffffff;--ink:#493d2c;--muted:#94836b;--line:#eee2ca;--soft:#f8efd9;--accent:#e5c58b;--accent2:#a47b3f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--accent) 19%,transparent),transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--soft);color:var(--ink);font-weight:700}button.primary{background:var(--accent);color:#101827;border-color:transparent}button:active{transform:translateY(1px)}
.wrap{max-width:1000px;margin:auto;padding:14px 14px 50px}.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;padding:8px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.menuBtn{font-size:20px;padding:8px 13px}.brandmini{font-weight:800;letter-spacing:.08em;font-size:13px;color:var(--accent2)}.spacer{flex:1}
.drawer{display:none;position:fixed;inset:0;z-index:20;background:#0009}.drawer.open{display:block}.drawerbox{width:min(310px,86vw);height:100%;background:var(--card);padding:18px;overflow:auto;box-shadow:var(--shadow)}.drawerhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.navbtn{display:flex;width:100%;text-align:left;margin:5px 0;align-items:center;gap:10px}.navbtn.active{background:var(--accent);color:#101827}
main{padding-top:8px}.hero{text-align:center;padding:26px 15px 22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 13%,var(--card)),var(--card));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:50%;width:230px;height:230px;top:-160px;left:-80px}.hero:after{left:auto;right:-120px;top:auto;bottom:-190px;width:300px;height:300px}
.avatar{width:108px;height:108px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 25px color-mix(in srgb,var(--accent) 40%,transparent);position:relative;z-index:1}.creator{font-weight:800;font-size:20px;margin:8px 0 2px;position:relative;z-index:1}.muted{color:var(--muted);font-size:12px;line-height:1.65}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent2);font-weight:800}.hero h1{font-size:clamp(25px,6vw,38px);letter-spacing:.08em;margin:8px 0}.hero p{margin:0 0 12px;color:var(--muted);font-size:12px}
.section{margin:18px 0}.section h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 5px 18px #0002}.tile{text-align:left;min-height:92px}.tile strong{display:block;margin:5px 0}.tile small{color:var(--muted);font-size:11px}.tile .ico{font-size:21px;color:var(--accent)}
.panel{margin:12px 0}.panel h2{font-size:18px;margin:0 0 5px}.intro{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.field{margin:10px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px}textarea{min-height:75px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result{background:var(--soft);padding:13px;border-radius:12px;margin-top:12px}.big{font-size:25px;font-weight:800;color:var(--accent2);margin:3px 0}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px}.stat small{font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--accent2);font-size:17px;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.list{display:grid;gap:8px;margin-top:10px}.item{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px}.item p{font-size:12px;color:var(--muted);margin:5px 0}.bar{height:8px;background:var(--line);border-radius:20px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:var(--accent)}.hidden{display:none!important}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.copyrow{display:flex;gap:8px;align-items:center}.copyrow button{white-space:nowrap}.footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.8;margin:25px 0}.link{color:var(--accent2);text-decoration:none}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.keypad button{font-size:18px;padding:15px 4px}.display{font-size:28px;text-align:right;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:auto}
.monthhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.day{min-height:55px;padding:5px 3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:11px}.day b{display:block}.day em{display:block;font-style:normal;color:var(--accent2);font-size:9px;overflow:hidden;white-space:nowrap}.day.blank{border:0;background:transparent}
.soundgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sound{padding:14px;text-align:center}.sound span{display:block;font-size:22px;margin-bottom:5px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.soundgrid{grid-template-columns:repeat(3,1fr)}.wrap{padding-left:22px;padding-right:22px}}
@media(max-width:380px){.row{grid-template-columns:1fr}.hero{padding:20px 10px}.avatar{width:90px;height:90px}}

.wheel-wrap{position:relative;width:min(88vw,420px);margin:22px auto 14px;aspect-ratio:1}.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 8px 24px #22334a22;border:7px solid #fff}.wheel-pointer{position:absolute;z-index:2;left:50%;top:-5px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #e85b78;filter:drop-shadow(0 2px 2px #0003)}
</style>
<style>
/* Ver.5 mobile-first refresh */
:root{--shadow:0 8px 24px rgba(60,90,130,.09)}
body{background:radial-gradient(ellipse at 10% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 45%),var(--bg)}
.topbar{gap:7px}.brandmini{font-size:12px}.panel,.tile{box-shadow:0 5px 18px rgba(60,90,130,.07);border-radius:18px}.tile{background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--accent) 7%,var(--card)))}
button{border-radius:13px}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#203047}
.field input,.field select{min-height:46px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--soft);font-size:11px}
.previewbox{border:1px dashed var(--line);border-radius:16px;padding:12px;background:var(--card)}
.profile-preview{border-radius:18px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#26334a;background:linear-gradient(135deg,#fce4ef,#e3f3ff)}
.profile-preview.darklook{color:#f5f4ff;background:linear-gradient(135deg,#20283d,#463858)}
.profile-preview img{width:76px;height:76px;object-fit:cover;border-radius:50%;border:3px solid #fff;margin-bottom:8px}
.profile-preview .pname{font-size:22px;font-weight:900}.profile-preview .ptext{font-size:12px;line-height:1.55;white-space:pre-wrap}
@media(max-width:430px){.topbar .brandmini{letter-spacing:0;font-size:10px}.topbar button{padding:8px 9px;font-size:12px}.row{grid-template-columns:1fr 1fr}}
</style>

function calendarPage(){let d=new Date(calYear,calMonth,1),start=d.getDay(),days=new Date(calYear,calMonth+1,0).getDate(),items=[...plans.map(x=>({...x,type:'配信'})),...events.map(x=>({...x,type:x.type||'記念日'}))];return card('カレンダー','配信予定・誕生日・記念日・イベントをまとめて管理します。',`<div class="field"><label>予定の種類</label><select id="ptype"><option>配信</option><option>誕生日</option><option>記念日</option><option>イベント</option></select></div><div class="row"><div><label>名前・予定名</label><input id="pname" placeholder="予定の名前"></div><div><label>日付と時刻</label><input id="pdate" type="datetime-local"></div></div><label>メモ</label><input id="pmemo" placeholder="任意"><button class="primary" onclick="addCalendarItem()">カレンダーに追加</button><div class="monthhead" style="margin-top:16px"><button onclick="changeMonth(-1)">‹</button><b>${calYear}年${calMonth+1}月</b><button onclick="changeMonth(1)">›</button></div><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${Array.from({length:start},()=>'<div class="day blank"></div>').join('')}${Array.from({length:days},(_,i)=>{let date=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,found=items.filter(x=>(x.date||'').slice(0,10)===date);return `<div class="day"><b>${i+1}</b>${found.map(x=>`<em>${esc(x.type)}:${esc(x.name)}</em>`).join('')}</div>`}).join('')}</div><h3>登録済み予定</h3><div class="list">${items.map((x)=>`<div class="item"><b>${esc(x.type)}：${esc(x.name)}</b><p>${esc(x.date)} ${esc(x.memo||'')}</p><button onclick="deleteCalendarItem('${x.type}', '${encodeURIComponent(x.name)}','${x.date}')">削除</button></div>`).join('')||'<p class="muted">予定はありません。</p>'}</div>`)}
let now=new Date(),calYear=now.getFullYear(),calMonth=now.getMonth();function changeMonth(v){calMonth+=v;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}show('calendar')}

function templatesPage(){let cats=['すべて',...new Set(templates.map(x=>x.cat))];return card('定型文ライブラリ','配信者・モデレーター向けの定期文を保存し、ワンタップでコピーできます。',`<label>カテゴリーで絞り込み</label><select id="tfilter" onchange="filterTemplates()">${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="templateList" class="list">${templateItems('すべて')}</div><h3>定型文を追加</h3><label>カテゴリー</label><input id="tcat" placeholder="例：モデレーター向け"><label>タイトル</label><input id="ttitle" placeholder="例：初見さん歓迎"><label>本文</label><textarea id="tbody" placeholder="定型文を入力"></textarea><button class="primary" onclick="addTemplate()">定型文を追加</button><p class="muted">本文中の「〇〇」は、コピー時に名前・絵文字・配信時間などへ置き換えられます。登録文はこのブラウザ内に保存されます。</p>`)}

function playTone(type){let C=window.AudioContext||window.webkitAudioContext;if(!C){alert('このブラウザでは音声再生に対応していません');return}let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);let now=c.currentTime,seq=type==='fanfare'?[523,659,784,1046]:type==='drum'?[110,90,70]:type==='clap'?[900,500]:type==='wrong'?[220,160]:type==='correct'?[660,880]:[880];seq.forEach((f,i)=>{let osc=c.createOscillator(),gain=c.createGain();osc.type=type==='clap'?'square':'sine';osc.frequency.value=f;osc.connect(gain);gain.connect(c.destination);let t=now+i*.13;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.13,t+.01);gain.gain.exponentialRampToValueAtTime(.0001,t+.12);osc.start(t);osc.stop(t+.14)});setTimeout(()=>c.close(),1000)}
function addSound(){let f=$('sfile').files[0];if(!f){alert('音声ファイルを選択してください');return}if(f.size>2*1024*1024){alert('試作版では2MB以下の音声ファイルを推奨します。');return}let r=new FileReader();r.onload=()=>{personalSounds.push({name:$('sname').value||f.name,data:r.result});save('sounds',personalSounds);show('sounds')};r.readAsDataURL(f)}

function calcKey(k){if(k==='AC')calcExpr='0';else if(k==='⌫')calcExpr=calcExpr.length>1?calcExpr.slice(0,-1):'0';else if(k==='='){try{let e=calcExpr.replaceAll('×','*').replaceAll('÷','/').replaceAll('＋','+').replaceAll('−','-').replace(/%/g,'/100');if(!/^[0-9+*/.() -]+$/.test(e))throw 0;calcExpr=String(Function('"use strict";return ('+e+')')())}catch{calcExpr='エラー'}}else calcExpr=calcExpr==='0'?k:calcExpr+k;calcRender()}
function settingsPage(){return card('設定','テーマ・ホーム表示・データ管理を行います。',`<label>テーマカラー</label><select id="themeSelect" onchange="setTheme(this.value)">${[['blue','Blue・水色'],['purple','Purple・ラベンダー'],['pink','Pink'],['dark','Dark・ネイビー'],['green','Green・ミント'],['cream','Cream・ベージュ']].map(x=>`<option value="${x[0]}" ${theme===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><h3>データのバックアップ</h3><button class="primary" onclick="exportData()">バックアップを書き出す</button><label style="margin-top:12px">バックアップを復元</label><input id="backupFile" type="file" accept="application/json"><button onclick="importData()">読み込む</button><h3>ホーム画面</h3><p class="muted">現在の試作版では主要機能へのショートカットを固定表示しています。カードの並べ替え・表示切替は次の改善候補です。</p><h3>プライバシー・免責事項</h3><p class="muted">アカウント登録は不要です。入力内容は原則この端末・ブラウザ内に保存されます。ブラウザデータの消去や端末変更で失われる場合があります。定期的にバックアップしてください。本サイトはMirrativ公式とは関係のない非公式ツールです。</p><p><a class="link" href="https://x.com/ta_fu_ta_fu" target="_blank" rel="noopener">改善案・不具合報告：@ta_fu_ta_fu ↗</a></p>`)}

function exportData(){let keys=['history','goals','notes','events','plans','income','templates','sounds','theme','giftRecords','lotHistory'];let obj={};keys.forEach(k=>obj[k]=localStorage.getItem('mtb_'+k));let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mirrativ-tool-box-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){let f=$('backupFile').files[0];if(!f){alert('バックアップファイルを選んでください');return}let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);Object.entries(o).forEach(([k,v])=>{if(v!==null)localStorage.setItem('mtb_'+k,v)});alert('復元しました。画面を再読み込みします。');location.reload()}catch{alert('バックアップファイルを読み込めませんでした')}};r.readAsText(f)}

function cheerPage(){return card('チアランクシミュレーター','2026年7月版の早見表を基準に、現在のレベルと目標を管理します。A・B・C条件を分けて確認できます。',`<div class="row"><div><label>現在のチアレベル</label><input id="chCurrent" type="number" min="0" max="55" value="0" oninput="cheerCalc()"></div><div><label>目標チアレベル</label><input id="chTarget" type="number" min="1" max="55" value="10" oninput="cheerCalc()"></div></div><label>確認する条件</label><select id="chCondition" onchange="cheerCalc()"><option value="A">A条件</option><option value="B">B条件</option><option value="C">C条件</option></select><div class="result"><div class="big" id="chGap">目標まで10レベル</div><div class="bar"><span id="chBar" style="width:0%"></span></div><div id="chRank"></div></div><p class="muted">チアランク到達レベル：ルーキー1 Lv.3／ルーキー2 Lv.5／リーダー1 Lv.10／リーダー2 Lv.15／リーダー3 Lv.20／リーダー4 Lv.25／ゴールド Lv.30／プラチナ Lv.35／ダイヤ Lv.40／レジェンド Lv.50。</p><p class="muted">※A・B・C各条件のレベル別必要数値は、画像の表を転記・照合してから計算に組み込む必要があるため、この版では未確定数値を表示しません。現在レベル・目標レベルとランク到達状況の確認に対応しています。</p>`)}
function cheerCalc(){if(!$('chCurrent'))return;let c=Math.max(0,Math.min(55,Number($('chCurrent').value)||0)),t=Math.max(1,Math.min(55,Number($('chTarget').value)||1)),pct=Math.min(100,c/t*100),ranks=[[3,'チアルーキー1'],[5,'チアルーキー2'],[10,'チアリーダー1'],[15,'チアリーダー2'],[20,'チアリーダー3'],[25,'チアリーダー4'],[30,'チアリーダー［ゴールド］'],[35,'チアリーダー［プラチナ］'],[40,'チアリーダー［ダイヤ］'],[50,'チアレジェンド']];$('chGap').textContent='目標まで '+Math.max(0,t-c)+' レベル';$('chBar').style.width=pct+'%';$('chRank').textContent='現在：'+(ranks.filter(x=>x[0]<=c).at(-1)?.[1]||'ランクなし')+' ／ 目標：'+(ranks.filter(x=>x[0]<=t).at(-1)?.[1]||'ランクなし')}

function fmtCoins(n){if(n==null)return '対象外';return Math.round(n).toLocaleString('ja-JP')+'コイン'}
function fmtTime(m){if(m==null)return '対象外';if(m<60)return m+'分';let h=Math.floor(m/60),r=m%60;return h+'時間'+(r?r+'分':'')}
function cheerPage(){let opts=CHEER_ROWS.map(r=>`<option value="${r[0]}">Lv.${r[0]}</option>`).join('');return card('チアランクシミュレーター','シーズン中の累計実績を入力すると、目標レベルに必要な残り量をA・B・C別に表示します。',`
<div class="row"><div><label>現在のチアレベル</label><select id="chCurrent" onchange="cheerTargetOptions();cheerCalc()">${[0,...CHEER_ROWS.map(r=>r[0])].map(n=>`<option value="${n}">Lv.${n}</option>`).join('')}</select></div><div><label>目標レベル</label><select id="chTarget" onchange="cheerCalc()">${opts}</select></div></div>
<h3>今シーズンの累計実績</h3><div class="row"><div><label>贈ったギフト（コイン）</label><input id="chGift" type="number" min="0" value="0" oninput="cheerCalc()"></div><div><label>視聴時間（時間）</label><input id="chHours" type="number" min="0" step="0.1" value="0" oninput="cheerCalc()"></div></div><div class="row"><div><label>視聴日数（日）</label><input id="chDays" type="number" min="0" value="0" oninput="cheerCalc()"></div><div><label>コメント数</label><input id="chComments" type="number" min="0" value="0" oninput="cheerCalc()"></div></div>
<div class="result"><div class="big" id="chRankName">目標ランク</div><div id="chGap"></div><div class="bar"><span id="chBar" style="width:0%"></span></div></div><div id="chConditionResults" class="list"></div>
<p class="muted">A・B・Cはそれぞれ独立した達成条件です。Aはギフト・時間・日数・コメント、Bはギフト・時間・コメント、Cはギフトのみ。いずれか1つをすべて満たせば、そのレベルに到達できます。視聴日数は連続5分以上の視聴でカウントされます。</p>
<h3>チアランク早見表</h3><img src="${CHEER_TABLE_DATA}" alt="2026年7月版チアランク早見表" style="width:100%;border-radius:14px;border:1px solid var(--line)"><button class="primary" onclick="downloadCheerTable()">早見表をPNGで保存</button>
<h3>チア機能の説明</h3><img id="cheerGuideImage" src="${CHEER_GUIDE_SVG}" alt="チア機能の説明インフォグラフィック" style="width:100%;border-radius:14px;border:1px solid var(--line)"><button class="primary" onclick="downloadCheerGuide()">説明画像をPNGで保存</button>
<p class="muted">早見表の出典：ユーザー提供「2026年7月現在の最新情報」画像。説明画像は同資料と提供された説明画像の内容を整理して作成しています。</p>`)}
function cheerTargetOptions(){let c=Number($('chCurrent')?.value||0),sel=$('chTarget');if(!sel)return;let next=CHEER_ROWS.find(r=>r[0]>c);if(next)sel.value=String(next[0]);}
function cheerCalc(){if(!$('chCurrent'))return;let c=Number($('chCurrent').value)||0,t=Number($('chTarget').value)||1,row=CHEER_ROWS.find(r=>r[0]===t);if(!row)return;let [lv,ag,am,ad,ac,bg,bm,bc,cg]=row,g=Number($('chGift').value)||0,m=(Number($('chHours').value)||0)*60,d=Number($('chDays').value)||0,co=Number($('chComments').value)||0;let ranks=CHEER_RANKS.filter(x=>x[0]<=t),rank=ranks[ranks.length-1];$('chRankName').textContent=rank?rank[1]+'（Lv.'+t+'・ボーナス'+rank[2]+'%）':'Lv.'+t;$('chGap').textContent=`現在 Lv.${c} → 目標 Lv.${t} ／ あと ${Math.max(0,t-c)} レベル`;$('chBar').style.width=Math.min(100,Math.max(0,c/t*100))+'%';
const conditions=[['A条件',[['ギフト',ag,g,'coin'],['視聴時間',am,m,'time'],['視聴日数',ad,d,'day'],['コメント',ac,co,'comment']]],['B条件',[['ギフト',bg,g,'coin'],['視聴時間',bm,m,'time'],['コメント',bc,co,'comment']]],['C条件',[['ギフト',cg,g,'coin']]]];
$('chConditionResults').innerHTML=conditions.map(([name,items])=>{let valid=items.filter(x=>x[1]!=null),met=valid.length>0&&valid.every(x=>x[2]>=x[1]);let lines=valid.map(([label,need,have,type])=>{let rem=Math.max(0,need-have),txt=type==='coin'?fmtCoins(rem):type==='time'?fmtTime(rem):type==='day'?rem+'日':rem+'コメント';return `<div class="row" style="justify-content:space-between"><span>${label}</span><b>${rem===0?'達成':`あと ${txt}`}</b></div>`}).join('');return `<div class="item"><div class="row" style="justify-content:space-between"><b>${name}</b><strong style="color:${met?'#16865d':'var(--accent)'}">${met?'達成済み':'未達成'}</strong></div>${lines||'<p class="muted">このレベルでは、この条件の数値は表にありません。</p>'}</div>`}).join('');}
function downloadDataUrl(data,name){let a=document.createElement('a');a.href=data;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function downloadCheerTable(){downloadDataUrl(CHEER_TABLE_DATA,'cheer-rank-reference-july-2026.png')}
function downloadCheerGuide(){let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=1200;c.height=1500;c.getContext('2d').drawImage(im,0,0);downloadDataUrl(c.toDataURL('image/png'),'cheer-function-guide.png')};im.src=CHEER_GUIDE_SVG}
function show(p){page=p;drawer(false);$('nav').innerHTML=pages.map(([id,ic,n])=>`<button class="navbtn ${p===id?'active':''}" onclick="show('${id}')">${ic}　${n}</button>`).join('');const map={home:homePage,coin:coinPage,stars:starsPage,history:historyPage,income:incomePage,goals:goalsPage,calendar:calendarPage,notes:notesPage,lottery:lotteryPage,templates:templatesPage,sounds:soundsPage,calculator:calculatorPage,settings:settingsPage,cheer:cheerPage,giftbook:giftBookPage};$('view').innerHTML=(map[p]||homePage)();if(p==='coin')coinCalc();if(p==='stars')starCalc();if(p==='calculator')calcRender();if(p==='cheer'){cheerTargetOptions();cheerCalc()}if(p==='lottery'){updateWheel();renderLotHistory()}}

function soundsPage(){return card('SEプレイヤー','OtoLogicの効果音を使用しています。通信が必要です。',`<div class="soundgrid">${OTO_SOUNDS.map(x=>`<button class="sound" onclick="playOto('${x[2]}')"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div><h3>個人音源を登録</h3><label>音源名</label><input id="sname" placeholder="効果音の名前"><label>音声ファイル</label><input id="sfile" type="file" accept="audio/*"><button class="primary" onclick="addSound()">音源を登録</button><div class="list">${personalSounds.map((s,i)=>`<div class="item"><b>${esc(s.name)}</b><div class="actions"><button onclick="playPersonal(${i})">▶ 再生</button><button onclick="deleteSound(${i})">削除</button></div></div>`).join('')||'<p class="muted">個人音源はまだありません。</p>'}</div><p class="muted">音素材：OtoLogic（https://otologic.jp）／CC BY 4.0。クレジット表記を条件に無料で利用しています。<a href="https://otologic.jp/free/license" target="_blank" rel="noopener">利用規約</a>・<a href="https://otologic.jp/free/faq" target="_blank" rel="noopener">FAQ</a></p>`)}

let wheelRotation=0, wheelBusy=false;
function lotteryPage(){return card('ルーレット抽選','候補を入力してルーレットを回そう。賭けやコインは使わない、候補選び用の抽選ツールです。',`<label>抽選候補（1行に1つ）</label><textarea id="candidates" oninput="refreshWheelInputs()" placeholder="候補A&#10;候補B&#10;候補C"></textarea><label>抽選方式</label><select id="lotMode" onchange="refreshWheelInputs()"><option value="equal">均等抽選</option><option value="weight">確率・重みを設定</option></select><div id="weightArea"></div><div class="wheel-wrap"><div class="wheel-pointer"></div><canvas id="wheelCanvas" width="620" height="620" aria-label="抽選ルーレット"></canvas></div><button class="primary" id="spinButton" onclick="drawLottery()">🎡 ルーレットを回す</button><div class="result"><small>当選結果</small><div class="big" id="lotteryResult">---</div></div><label><input type="checkbox" id="removeWinner" style="width:auto">当選者を次回以降の候補から除外</label><h3>当選履歴</h3><div id="lotHistory" class="list"></div>`)}
function wheelEntries(){let lines=($('candidates')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);let ws=lines.map((_,i)=>Math.max(0,Number($('w'+i)?.value??1)||0));if($('lotMode')?.value!=='weight')ws=lines.map(()=>1);return lines.map((name,i)=>({name,weight:ws[i],idx:i})).filter(x=>x.weight>0)}
function refreshWheelInputs(){let lines=($('candidates')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if($('weightArea')&&$('lotMode')?.value==='weight')$('weightArea').innerHTML=lines.map((x,i)=>`<label>${esc(x)} の重み（大きいほど当たりやすい）</label><input id="w${i}" type="number" min="0" step="0.1" value="1" oninput="updateWheel()">`).join('');else if($('weightArea'))$('weightArea').innerHTML='<p class="muted">すべての候補が同じ確率です。</p>';updateWheel()}
function updateWheel(){let cv=$('wheelCanvas');if(!cv)return;let ctx=cv.getContext('2d'),entries=wheelEntries(),cx=310,cy=310,r=285;ctx.clearRect(0,0,620,620);if(!entries.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#e8edf5';ctx.fill();ctx.fillStyle='#596579';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('候補を入力してね',cx,cy);return}let total=entries.reduce((a,x)=>a+x.weight,0),a=-Math.PI/2;let colors=['#8bc7f4','#f7a8c8','#a9d9bd','#f6d18a','#b8a7ed','#f3a68c','#8ddbd5','#d6b0e8'];entries.forEach((e,i)=>{let span=e.weight/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+span);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(a+span/2);ctx.textAlign='right';ctx.fillStyle='#26334d';ctx.font='bold 22px sans-serif';let label=e.name.length>13?e.name.slice(0,12)+'…':e.name;ctx.fillText(label,r-24,8);ctx.restore();a+=span});ctx.beginPath();ctx.arc(cx,cy,38,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#d4deec';ctx.lineWidth=4;ctx.stroke()}
function drawLottery(){if(wheelBusy)return;let entries=wheelEntries();if(!entries.length){$('lotteryResult').textContent='候補を入力してください';return}let total=entries.reduce((a,x)=>a+x.weight,0);if(!total){$('lotteryResult').textContent='重みを1つ以上設定してください';return}let r=Math.random()*total,chosen=entries[entries.length-1],acc=0;for(let e of entries){acc+=e.weight;if(r<acc){chosen=e;break}}let angle=-Math.PI/2;for(let e of entries){let span=e.weight/total*Math.PI*2;if(e.idx===chosen.idx){angle+=span/2;break}angle+=span}let target=(((-Math.PI/2-angle)*180/Math.PI)%360+360)%360;let current=((wheelRotation%360)+360)%360;let delta=(target-current+360)%360;wheelRotation+=360*6+delta;let cv=$('wheelCanvas');wheelBusy=true;$('spinButton').disabled=true;$('lotteryResult').textContent='抽選中…';playOto(OTO_SOUNDS[2][2]);cv.style.transition='transform 4.2s cubic-bezier(.12,.72,.08,1)';cv.style.transform=`rotate(${wheelRotation}deg)`;setTimeout(()=>{wheelBusy=false;$('spinButton').disabled=false;$('lotteryResult').textContent=chosen.name;playOto(OTO_SOUNDS[0][2]);let h=load('lotHistory',[]);h.unshift({name:chosen.name,date:new Date().toLocaleString('ja-JP')});save('lotHistory',h.slice(0,50));if($('removeWinner').checked){let arr=($('candidates').value||'').split(/\n/);let seen=0;let kept=[];for(let i=0;i<arr.length;i++){let v=arr[i].trim();if(v===chosen.name&&seen===0){seen++;continue}kept.push(arr[i])}$('candidates').value=kept.join('\n');refreshWheelInputs()}renderLotHistory()},4300)}
function renderLotHistory(){let el=$('lotHistory');if(el)el.innerHTML=load('lotHistory',[]).map(x=>`<div class="item">${esc(x.name)}<p>${esc(x.date)}</p></div>`).join('')||'<p class="muted">まだ抽選履歴はありません。</p>'}

show('home');
</script></body></html>
