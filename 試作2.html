<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf7fc"><title>Mirrativ TOOL BOX</title>
<style>
:root{--bg:#f3f9fc;--card:#fff;--ink:#263746;--muted:#718592;--line:#dceaf0;--soft:#eaf7fc;--blue:#2699c5;--blue2:#187da6}
[data-theme=dark]{--bg:#111c25;--card:#1b2a36;--ink:#e8f2f7;--muted:#9db0bc;--line:#304653;--soft:#233d4c;--blue:#72c9ec;--blue2:#9bdcf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:850px;width:calc(100% - 24px);margin:auto;padding:20px 0 45px}header{text-align:center;padding:8px 8px 18px}.logo{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--soft);color:var(--blue);font-size:25px}h1{font-size:25px;color:var(--blue2);margin:8px 0 3px}.tag{font-size:12px;color:var(--muted)}.top{text-align:right;margin-bottom:8px}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--soft);color:var(--blue2);font-weight:700;font-size:13px;cursor:pointer}.primary{background:var(--blue);color:white}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.tabs button{white-space:nowrap;flex-shrink:0}.tabs .active{background:var(--blue);color:white}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px}h2{font-size:18px;margin:0 0 5px}.intro,.muted{font-size:12px;color:var(--muted);line-height:1.6}.field{margin:11px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result{background:var(--soft);padding:13px;border-radius:12px;margin-top:12px}.big{font-size:25px;font-weight:800;color:var(--blue2);margin:3px 0}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px}.stat small{font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--blue2);font-size:17px;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.list{display:grid;gap:8px;margin-top:10px}.item{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px}.item p{font-size:12px;color:var(--muted);margin:5px 0}.bar{height:9px;background:var(--line);border-radius:20px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:var(--blue)}.hidden{display:none}h3{font-size:14px;margin:17px 0 8px}footer{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}@media(max-width:500px){main{width:calc(100% - 18px)}.panel{padding:13px}}
</style></head><body><main><header><div class="top"><button id="themeBtn" onclick="toggleTheme()">🌙 ダークモード</button></div><div class="logo">✦</div><h1>Mirrativ TOOL BOX</h1><div class="tag">ミラティブユーザーのための便利ツール</div></header><nav class="tabs" id="tabs"></nav><div id="view"></div><footer>個人制作の計算補助ツールです。ミラティブ公式とは関係ありません。<br>入力データは原則このブラウザ内に保存されます。</footer></main>
<script>
const $=id=>document.getElementById(id),n=id=>Math.max(0,Number($(id)?.value)||0),fmt=x=>Number(x.toFixed(2)).toLocaleString('ja-JP',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(k){try{return JSON.parse(localStorage.getItem('mtb_'+k))||[]}catch{return[]}}function save(k,v){localStorage.setItem('mtb_'+k,JSON.stringify(v))}
let hist=load('history'),goals=load('goals'),notes=load('notes'),events=load('events'),plans=load('plans'),page='coin';
const ids=['coin','stars','history','goals','notes','events','plans','glossary'],names=['コイン計算','スターズ','計算履歴','目標管理','配信記録','イベント','スケジュール','用語集'];
function show(p){page=p;$('tabs').innerHTML=ids.map((x,i)=>`<button class="${p===x?'active':''}" onclick="show('${x}')">${names[i]}</button>`).join('');$('view').innerHTML=({coin:coinPage,stars:starsPage,history:historyPage,goals:goalsPage,notes:notesPage,events:eventsPage,plans:plansPage,glossary:glossaryPage})[p]()}
function card(t,d,b){return `<section class="panel"><h2>${t}</h2><div class="intro">${d}</div>${b}</section>`}
function coinPage(){return card('コイン還元・比較・逆算','無償30%・有償90%として計算します。',`
<div class="row"><div class="field"><label>無償コイン（枚）</label><input id="cf" type="number" min="0" value="0" oninput="coinCalc()"></div><div class="field"><label>有償コイン（枚）</label><input id="cp" type="number" min="0" value="0" oninput="coinCalc()"></div></div>
<div class="result"><small>還元コイン合計（目安）</small><div class="big" id="cr">0 枚</div><div class="row"><div class="stat"><small>無償分・30%</small><b id="crf">0枚</b></div><div class="stat"><small>有償分・90%</small><b id="crp">0枚</b></div></div><div class="actions"><button onclick="copyText($('cr').textContent)">結果をコピー</button><button class="primary" onclick="saveCoin()">履歴に保存</button></div></div>
<h3>還元枚数から逆算</h3><label>目標還元枚数</label><input id="ct" type="number" value="1000" min="0" oninput="coinReverse()"><div class="row"><div class="stat"><small>無償のみ</small><b id="crfree">3,334枚</b></div><div class="stat"><small>有償のみ</small><b id="crpaid">1,112枚</b></div></div>
<h3>同じコイン数で比較</h3><label>比較するコイン数</label><input id="cc" type="number" value="1000" min="0" oninput="coinCompare()"><div class="row"><div class="stat"><small>無償の還元</small><b id="ccf">300枚</b></div><div class="stat"><small>有償の還元</small><b id="ccp">900枚</b></div></div><p class="muted">※端数処理は小数表示です。実際の付与仕様と異なる場合があります。</p>`)}
function coinCalc(){let f=n('cf')*.3,p=n('cp')*.9;$('cr').textContent=fmt(f+p)+' 枚';$('crf').textContent=fmt(f)+' 枚';$('crp').textContent=fmt(p)+' 枚'}
function coinReverse(){let t=n('ct');$('crfree').textContent=Math.ceil(t/.3).toLocaleString()+'枚';$('crpaid').textContent=Math.ceil(t/.9).toLocaleString()+'枚'}
function coinCompare(){let c=n('cc');$('ccf').textContent=fmt(c*.3)+'枚';$('ccp').textContent=fmt(c*.9)+'枚'}
function saveCoin(){hist.unshift({date:new Date().toLocaleString('ja-JP'),text:`無償${n('cf')}枚・有償${n('cp')}枚 → ${$('cr').textContent}`});hist=hist.slice(0,100);save('history',hist);alert('履歴に保存しました')}
function starsPage(){return card('スターメーター','無償1枚＝0.3pt、有償1枚＝1ptとして計算します。',`
<div class="row"><div><label>現在のポイント</label><input id="sc" type="number" value="0" min="0" oninput="starCalc()"></div><div><label>目標ポイント</label><input id="st" type="number" value="1000" min="0" oninput="starCalc()"></div></div><div class="result"><small>目標まであと</small><div class="big" id="sg">1,000pt</div><div class="bar"><span id="sbar" style="width:0%"></span></div><small id="spercent">達成率0%</small><div class="row"><div class="stat"><small>無償のみ必要数</small><b id="sfree">3,334枚</b></div><div class="stat"><small>有償のみ必要数</small><b id="spaid">1,000枚</b></div></div></div>
<h3>コイン配分シミュレーター</h3><label>使用する無償コイン</label><input id="smix" type="number" value="0" min="0" oninput="starCalc()"><div class="row"><div class="stat"><small>無償加算ポイント</small><b id="smixpt">0pt</b></div><div class="stat"><small>追加の有償コイン</small><b id="smixpaid">1,000枚</b></div></div><div class="actions"><button onclick="copyText('目標まで'+$('sg').textContent+'／有償'+$('smixpaid').textContent)">結果をコピー</button><button class="primary" onclick="addGoalFromStar()">目標を保存</button></div>
<h3>複数目標の比較</h3><div class="row"><div><label>目標A（pt）</label><input id="sa" type="number" value="500" oninput="starCompare()"></div><div><label>目標B（pt）</label><input id="sb" type="number" value="1000" oninput="starCompare()"></div></div><div class="row"><div class="stat"><small>A・有償必要数</small><b id="sao">500枚</b></div><div class="stat"><small>B・有償必要数</small><b id="sbo">1,000枚</b></div></div>`)}
function starCalc(){let c=n('sc'),t=n('st'),gap=Math.max(0,t-c),free=n('smix'),pt=free*.3,rem=Math.max(0,gap-pt),pct=t?Math.min(100,c/t*100):100;$('sg').textContent=fmt(gap)+' pt';$('sfree').textContent=Math.ceil(gap/.3).toLocaleString()+'枚';$('spaid').textContent=Math.ceil(gap).toLocaleString()+'枚';$('sbar').style.width=pct+'%';$('spercent').textContent='達成率 '+fmt(pct)+'%';$('smixpt').textContent=fmt(pt)+'pt';$('smixpaid').textContent=Math.ceil(rem).toLocaleString()+'枚';starCompare()}
function starCompare(){if(!$('sa'))return;$('sao').textContent=Math.ceil(n('sa')).toLocaleString()+'枚';$('sbo').textContent=Math.ceil(n('sb')).toLocaleString()+'枚'}
function addGoalFromStar(){goals.push({name:'スターズ目標',current:n('sc'),target:n('st')});save('goals',goals);alert('目標管理に保存しました')}
function historyPage(){return card('計算履歴','このブラウザ内に保存された履歴です。',`${hist.map(x=>`<div class="item"><b>${esc(x.date)}</b><p>${esc(x.text)}</p></div>`).join('')||'<p class="muted">履歴はありません。</p>'}<button onclick="hist=[];save('history',hist);show('history')">履歴を削除</button>`)}
function goalsPage(){return card('配信目標管理','目標と進捗を管理します。',`<label>目標名</label><input id="gn" placeholder="今月の目標"><div class="row"><div><label>現在値</label><input id="gc" type="number" value="0"></div><div><label>目標値</label><input id="gt" type="number" value="1000"></div></div><button class="primary" onclick="addGoal()">追加</button><div class="list">${goals.map((g,i)=>{let p=g.target?Math.min(100,g.current/g.target*100):0;return `<div class="item"><b>${esc(g.name)}</b><p>${g.current} / ${g.target}（${fmt(p)}%）</p><div class="bar"><span style="width:${p}%"></span></div><button onclick="updateGoal(${i})">現在値更新</button> <button onclick="goals.splice(${i},1);save('goals',goals);show('goals')">削除</button></div>`}).join('')}</div>`)}
function addGoal(){goals.push({name:$('gn').value||'配信目標',current:n('gc'),target:n('gt')});save('goals',goals);show('goals')}
function updateGoal(i){let v=prompt('現在値',goals[i].current);if(v!==null){goals[i].current=Math.max(0,Number(v)||0);save('goals',goals);show('goals')}}
function notesPage(){return card('配信記録ノート','配信日・配信時間・メモを保存します。',`<label>配信日</label><input id="nd" type="date"><label>配信時間（分）</label><input id="nt" type="number" min="0"><label>メモ</label><textarea id="nm"></textarea><button class="primary" onclick="notes.unshift({date:$('nd').value||new Date().toISOString().slice(0,10),time:n('nt'),memo:$('nm').value});save('notes',notes);show('notes')">記録を保存</button><div class="list">${notes.map((x,i)=>`<div class="item"><b>${esc(x.date)}・${x.time}分</b><p>${esc(x.memo)}</p><button onclick="notes.splice(${i},1);save('notes',notes);show('notes')">削除</button></div>`).join('')}</div>`)}
function eventsPage(){return card('イベントカウントダウン','イベント終了日時を登録して残り時間を確認します。',`<label>イベント名</label><input id="en" placeholder="イベント名"><label>終了日時</label><input id="ed" type="datetime-local"><button class="primary" onclick="events.push({name:$('en').value,date:$('ed').value});save('events',events);show('events')">登録</button><div class="list">${events.map((e,i)=>{let left=new Date(e.date)-Date.now(),txt=left<0?'終了':`${Math.floor(left/86400000)}日 ${Math.floor(left%86400000/3600000)}時間`;return `<div class="item"><b>${esc(e.name)}</b><p>${esc(e.date)} ／ 残り ${txt}</p><button onclick="events.splice(${i},1);save('events',events);show('events')">削除</button></div>`}).join('')}</div>`)}
function plansPage(){return card('配信スケジュール','配信予定を登録して一覧で管理します。',`<label>予定名</label><input id="pn" placeholder="夜配信"><label>日時</label><input id="pd" type="datetime-local"><label>メモ</label><input id="pm"><button class="primary" onclick="plans.push({name:$('pn').value,date:$('pd').value,memo:$('pm').value});save('plans',plans);show('plans')">予定を追加</button><div class="list">${plans.slice().sort((a,b)=>a.date.localeCompare(b.date)).map((p,i)=>`<div class="item"><b>${esc(p.name)}</b><p>${esc(p.date)} ${esc(p.memo)}</p><button onclick="plans.splice(${i},1);save('plans',plans);show('plans')">削除</button></div>`).join('')}</div>`)}
function glossaryPage(){let a=[['無償コイン','配布・獲得などで入手する無償扱いのコイン。'],['有償コイン','購入などによって取得する有償扱いのコイン。'],['還元コイン','ギフト利用に関連して配信者側に還元されるコイン。'],['スターメーター','スターズ関連の進捗を示すメーター。'],['スターズ','ミラティブ内の配信者向け制度・機能の名称。'],['盛り上がり','配信の盛り上がりに関係する指標・報酬の呼称。']];return card('ミラティブ用語集','基本用語の簡易説明です。',a.map(x=>`<div class="item"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')+'<p class="muted">正式な定義・条件はミラティブ公式ヘルプをご確認ください。</p>')}
function copyText(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('コピーしました')).catch(()=>alert(t));else alert(t)}
function toggleTheme(){let d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('mtb_theme',d?'light':'dark');$('themeBtn').textContent=d?'🌙 ダークモード':'☀️ ライトモード'}
let theme=localStorage.getItem('mtb_theme')||'light';document.documentElement.setAttribute('data-theme',theme);$('themeBtn').textContent=theme==='dark'?'☀️ ライトモード':'🌙 ダークモード';show('coin');coinCalc();coinReverse();coinCompare();
</script></body></html>
